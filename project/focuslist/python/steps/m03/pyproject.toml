[project]
name = "focuslist"
version = "0.1.0"
description = "Persönliche Aufgabenliste (CLI), Stand v0 zum Start von Modul 4."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
focuslist = "focuslist.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["focuslist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
