[project]
name = "focuslist"
version = "4.0.0"
description = "Persönliche Aufgabenliste (CLI), Stand v4 zum Start von Modul 8."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
focuslist = "focuslist.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["focuslist*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
