[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "focuslist"
version = "0.1.0"
description = "FocusList – kleine Aufgabenliste für den Kurs Agentic Coding mit GitHub Copilot"
requires-python = ">=3.12"
dependencies = ["flask>=3.1", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["focuslist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
