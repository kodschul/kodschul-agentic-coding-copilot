# FocusList – projektweite Codex-Konfiguration (Stand: 10/2026)
# Wird nur geladen, wenn Codex dem Projekt vertraut (trusted project).
# Quellen: https://learn.chatgpt.com/docs/extend/mcp?surface=cli, https://learn.chatgpt.com/docs/config-file/config-basic

# Gegenstück zur Tool-Bestätigung im Copilot-Agent-Modus: Dateien im Projekt schreiben,
# für alles andere (z. B. Netzwerk, Dateien außerhalb) vorher nachfragen.
# Quelle: https://learn.chatgpt.com/docs/config-file/config-reference
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Gegenstück zu .vscode/mcp.json (Modul 8): Ticket-Ordner neben dem Projektordner.
# args werden unverändert an den Server übergeben; wie relative Pfade darin aufgelöst werden,
# ist nicht dokumentiert. Codex daher im Projektordner starten; sonst absoluten Pfad eintragen.
[mcp_servers.focuslist_tickets]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "../focuslist-tickets"]
startup_timeout_sec = 30

# Subagents für die Feature-Kette (Code -> Test -> Review), siehe .codex/agents/.
[agents]
max_concurrent_threads_per_session = 3
