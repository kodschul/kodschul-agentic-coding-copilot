[project]
name = "sample-project"
version = "1.0.0"
description = "Fremdprojekt für generische Übungen (Python-Variante)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["sample*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
